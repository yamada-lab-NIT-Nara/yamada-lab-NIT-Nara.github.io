name: Publish laboratory website
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *' # 11:23 JST daily, best-effort
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync public researchmap records if approved
        env:
          RESEARCHMAP_API_APPROVED: ${{ vars.RESEARCHMAP_API_APPROVED }}
          RESEARCHMAP_API_TOKEN: ${{ secrets.RESEARCHMAP_API_TOKEN }}
        run: |
          python sync_researchmap.py
      - name: Store refreshed public data in repository
        if: ${{ vars.RESEARCHMAP_API_APPROVED == 'true' }}
        run: |
          if ! git diff --quiet -- data/researchmap.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/researchmap.json
            git commit -m 'Update public researchmap records'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
