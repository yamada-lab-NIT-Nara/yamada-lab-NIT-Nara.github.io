name: Publish laboratory website

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *' # 11:23 JST daily (may be delayed)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync public ORCID publications and funding
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python sync_orcid.py

      - name: Save updated ORCID data
        run: |
          if [ -f data/orcid.json ] || [ -f data/funding.json ]; then
            git add data/orcid.json data/funding.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update public ORCID publications and funding'
              git push
            fi
          fi

      - name: Generate microCMS NEWS, seeds, members and facilities
        env:
          MICROCMS_SERVICE_ID: yamada-lab-nara
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          python -m pip install beautifulsoup4==4.14.3
          python sync_microcms.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
